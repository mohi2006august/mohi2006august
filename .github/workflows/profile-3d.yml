name: 📊 Generate 3D Contribution Graph

on:
  schedule:
    # Runs daily at 18:30 UTC (00:00 midnight IST)
    - cron: "30 18 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/profile-3d.yml"

concurrency:
  group: profile-3d-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Generate 3D Contribution Graph
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add profile-3d-contrib/
          
          if git diff --staged --quiet; then
            echo "✅ No changes to commit"
            exit 0
          fi
          
          git commit -m "chore(profile-3d): auto-update 3D contribution graph [skip ci]"
          git pull --rebase --autostash origin main
          git push origin main
