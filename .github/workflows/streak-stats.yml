name: 🔥 Generate Streak Stats

on:
  schedule:
    # Runs daily at 18:45 UTC (00:15 IST)
    - cron: "45 18 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/streak-stats.yml"

concurrency:
  group: streak-stats-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Generate Streak Stats SVG
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: >-
            user=${{ github.repository_owner }}&theme=github-dark-blue&hide_border=true&background=0d1117&stroke=00d2ff&ring=00d2ff&fire=f78166&currStreakLabel=00d2ff&sideLabels=c0caf5&dates=c0caf5&sideNums=ffffff&currStreakNum=ffffff
          path: profile-streak-contrib/streak-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push changes
        run: |
          git config --local user.name "mohi2006august"
          git config --local user.email "nizamuddinnumaan822@gmail.com"
          
          git add profile-streak-contrib/streak-stats.svg
          
          if git diff --staged --quiet; then
            echo "✅ No changes to commit"
            exit 0
          fi
          
          git commit --author="mohi2006august <nizamuddinnumaan822@gmail.com>" -m "chore(streak): auto-update streak stats [skip ci]"
          git pull --rebase --autostash origin main
          git push origin main
